<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Moka</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f1ec;
      color:#222;
    }

    header{
      background:#d8c2a3;
      padding:80px 20px;
      text-align:center;
    }

    header h1{
      font-size:72px;
      margin:0;
    }

    header p{
      font-size:28px;
      margin-top:10px;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:40px 20px;
    }

    .card{
      background:white;
      border-radius:24px;
      padding:40px;
      margin-bottom:40px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    h2{
      font-size:40px;
      margin-bottom:20px;
    }

    .item{
      display:flex;
      justify-content:space-between;
      padding:14px 0;
      border-bottom:1px solid #eee;
      font-size:22px;
    }

    footer{
      text-align:center;
      padding:50px 20px;
      color:#666;
    }
  </style>
</head>

<body>

<header>
  <h1>Maison Moka</h1>
  <p>Douceur & raffinement à Marrakech</p>
</header>

<div class="container">

  <div class="card">
    <h2>Tiramisus Signature</h2>

    <div class="item">
      <span>Crème de Pistache</span>
      <span>75 DH</span>
    </div>

    <div class="item">
      <span>Éclat de Country Nutella</span>
      <span>75 DH</span>
    </div>

    <div class="item">
      <span>Framboise Pistache Kunafa</span>
      <span>75 DH</span>
    </div>
  </div>

  <div class="card">
    <h2>Boissons</h2>

    <div class="item">
      <span>Matcha</span>
      <span>45 / 55 DH</span>
    </div>

    <div class="item">
      <span>Ube Coco</span>
      <span>40 / 55 DH</span>
    </div>

    <div class="item">
      <span>Frappuccino</span>
      <span>45 / 55 DH</span>
    </div>
  </div>

  <div class="card">
    <h2>Horaires</h2>
    <p>Ouvert tous les jours</p>
    <p>11h — 23h</p>
  </div>

</div>

<footer>
  Maison Moka • Marrakech
</footer>

</body>
</html>
